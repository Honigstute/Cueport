appId: com.cueport.app
productName: Cueport
copyright: Copyright © 2026 Cueport
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.graphics-design
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  buildUniversalInstaller: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
